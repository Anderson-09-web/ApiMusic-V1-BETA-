server:
  port: 8080
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true

  server:
    password: ""
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TV
      - ANDROID_VR
      - WEB
      - TVHTML5_SIMPLY


    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    oauth:
      enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
